# Verification continue du memoire, a chaque push et a chaque pull request.
#
# Trois jobs :
#   1. garde-fous  : structure, liens documentaires, fichiers interdits et tests
#                    sur Windows et Linux ;
#   2. harnais     : chaque nombre publie est confirme par la sortie versionnee du script
#                    qui le calcule ;
#   3. compilation : la chaine complete du projet, refaire_tout.py, compile les deux versions,
#                    controle debordements, references cassees, pages et flottants, et
#                    verifie que la version Institut, figee depuis le 1er octobre 2026, garde
#                    le contenu du PDF committe.
#
# La donnee brute n'est jamais necessaire ici : le harnais ne lit que sorties_verif/, et la
# compilation que les figures versionnees. Les griffes de la couverture etant gitignorees, les
# PDF produits par la CI n'ont pas de signature : ce sont des PDF de controle, pas de depot.

name: Vérification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  garde-fous:
    name: Structure et garde-fous (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Navigation, chemins stables et fichiers suivis
        run: python projet.py structure

      - name: Les garde-fous refusent les erreurs
        run: python -m unittest discover -s outils/ci -p "test_*.py"

  harnais:
    name: Harnais des chiffres
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Chaque nombre publié est confirmé par la sortie de son script
        run: python outils/ci/harnais_strict.py

  compilation:
    name: Compilation et contrôles du mémoire
    runs-on: ubuntu-latest
    needs: [garde-fous, harnais]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Lecture des PDF produits
        run: pip install "pymupdf>=1.24"

      # Meme version que sur le poste de travail : le paquet de polices et de classes que
      # tectonic telecharge depend de sa version, et les debordements avec lui.
      - uses: wtfjoke/setup-tectonic@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          tectonic-version: 0.16.9

      - name: Chaîne complète du mémoire (le harnais est passé au job précédent)
        run: python memoire/refaire_tout.py --sans-harnais

      - name: Version Institut actuelle
        run: |
          tectonic --keep-logs memoire/main_institut_150.tex
          python -c "import pymupdf; d=pymupdf.open('memoire/main_institut_150.pdf'); assert d.page_count == 152, d.page_count; assert not any('??' in p.get_text() for p in d), 'Renvoi non resolu'"

      - name: PDF de contrôle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memoire-pdf-controle
          path: |
            memoire/main_ensae.pdf
            memoire/main_institut.pdf
            memoire/main_institut_150.pdf
          retention-days: 30
